[package]
name = "Ornata"
version = "0.10.0"
description = "Local-first markdown notes"
authors = ["Saurabh"]
license = "MIT"
edition = "2021"
default-run = "Ornata"

[lib]
name = "ornata_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.11", features = ["v4"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip"] }
trash = "5"
notify = "8.2.0"
tiny_http = "0.12"
dunce = "1.0.5"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2.5.4"

[dev-dependencies]
tempfile = "3"

# Silent PDF export (pdf_export.rs) drives WebKit's print operation directly;
# pdf_outline.rs adds heading bookmarks with PDFKit.
# Same objc2 family versions wry already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSGeometry", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["std", "PDFDestination", "PDFDocument", "PDFOutline", "PDFPage", "PDFSelection"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }
